            { id: 19, dorm: "청운관, 여성 기숙사", category: "청소 및 위생", date: "2026-09-21 22:34:20", content: "화장실 변기 물 안내리는것과 샤워실 벽면에 여드름패치 붙이기, 샤워실에서 소변누기 등과 같은것들이 고쳐졌으면 좋겠습니다", replyStatus: null, replyContent: "" },
            { id: 20, dorm: "미래관, 남성 기숙사", category: "생활 규정 및 점호", date: "2026-09-21 22:38:44", content: "벌점 고득자 투표제(퇴소,10점 이상의 벌점 부과등)\n기숙사는 학교와 집 사이 거리가 멀어 통학이 어려운 학생들의 통학을 편히하게 위해 만든 시설이라고 생각합니다.\n그런 장거리 통학생들에게 제일 큰 타격을 주는 형벌은 퇴소라고 생각합니다. 기숙사생들 중에는 통학거리가 집과 가까운 학생도 있는 반면에 집과 거리가 먼 학샹들도 많이 있습니다. 집과 학교사이에 통학거리가 먼 경우 기숙사 퇴소시에는 학업에도 차질이 생길 수 있으며 성찰교실에도 갈 수 있습니다. 이런 부분은 장거리 통학 학생들의 학업을 방해할 뿐더러 학생들의 학습권을 보장하는 역할을 하는 기숙사의 취지와는 좀 엇나가는 것 같다는 개인적인 의문이 듭니다. 물론 벌점을 먹는 여러 이유 중 다른 학샹들과 사용하는 공간이니만큼 다른 학생들을 배려하는 규칙이 있고 개인의 안전을 위한 규칙,등 여러 학생을 위한 규칙이 마련되어있어 이러한 규칙을 어긴 학생의 벌점이 부당하다는것은 아닙니다.\n하지만 기숙사 생활을 하며 여러가지 벌점 사례를 보았는데 그중제가 문제삼고 싶은점은 사감선생님의 감정적인 벌점 부과입니다. 지금까지 기숙사에 생활하며 벌점 받을 사유긴 하지만 그에비해 너무 높은 벌점을 받은 사례가 몇몇 있었고 어떤날은 사감선생님의 감시가 삼엄해지는 날도 있었습니다. 예를들어 소등 이후 사감선생님께서 방에 후레쉬를 비추시며 들어와 잠들려던 학샹들이게 비추는 경우도 있었습니다. 여자 기숙사에서는 이런 경우가 있는지는 잘 모르겠으나 안전이라는 이유로 자야될 학생들 침대에 후레쉬를 비추는 경우는 잘못된것 같습니다. 본론으로 돌아와서 벌점을 10점 이상 한번에 받게 되어 퇴사 점수에 달성한 학생에대해 카카오톡 투표방에서 학생들이 투표하여 결정하는것이 제가 생각해본 방법입니다. 왜이런 생각을 하냐면 벌점은 다른 학생에게 방해가 되는 행동을 한 경우 먹게되는데 만약 다른 학생들의 기분과는 상관없이 사감선생님의 개인적인 감정으로 발점이 부과되는것에 대해 다른 학생들이 직접 판단 후 퇴사가 결정되는것이 벌점의 취지에 맞다고 생각됩니다. 귀찮다고 생각될 수 있지만 그 학생에 대해서는 주변 학생들이 제일 잘 압니다. 그 행동이 무심코 잘못나오게된 행동인지, 의도적으로 악의적인 의도로 지속된 행위인지 그 주변 학생들이 제일 잘알기에 판단이 잘못될 경우는 드물것 같습니다. 귀찮아보여도 기숙사에서 억울한 일이 줄어들기 바라는 마음으로 건의 드립니다. 긴글 읽어주셔서 감사합니다.", replyStatus: "회신 대기", replyContent: "" },

            { id: 26, dorm: "청운관, 여성 기숙사", category: "생활 규정 및 점호", date: "2026-09-21 23:44:59", content: "추공실에 제발 와이π 좀 해주세요 고딩이나 되어서 추공실에서 게임하고 놀려는 것이 아니라 피피티를 만들거나 보고서를 쓰거나 자료조사를 하거나 검색을 해야할 때가 많은데 너무 불편합니다", replyStatus: "회신 필요", replyContent: "" },
            { id: 27, dorm: "미래관, 남성 기숙사", category: "청소 및 위생", date: "2026-09-22 00:22:43", content: "5층 510호 추공실\n에어컨 방치로 인해 에어컨을 틀때 나오는 먼지가 너무많이 그 추공실을 쓰지 못한다", replyStatus: "회신 완료", replyContent: "귀하께서 제기해 주신 안건은 ‘추가 학습실 내 에어컨 필터 청소 및 전반적인 위생 관리 강화’에 관한 건으로 확인되었습니다.\n\n본 자치위원회에서는 해당 안건에 대해 면밀한 실태 조사를 진행하였으며, 현행 기숙사 방침상 에어컨 필터 관리가 연 1회 실시되고 있음을 확인하였습니다. 이를 비롯한 관련 안건들을 확인하고 적극 수용하였으며, 담당 지도교사 및 사감 교사께 관련 문제점과 개선 필요성을 즉시 전달하였습니다.\n\n이에 대한 후속 조치로, 기숙사생 전체를 대상으로 ‘기숙사 위생 관리 실태 및 개선에 관한 설문조사’를 실시할 예정입니다. 수집된 설문 결과를 바탕으로 조속한 시일 내에 전면적인 위생 점검 및 에어컨 청소가 집행될 수 있도록 관계 부서와 지속해서 협의하겠습니다.\n\n또한 제기해 주신 것처럼, 기숙사 자치위원회는 학생들의 건강과 학습 권익 보호를 최우선 과제로 인식하고 있습니다. 제기해 주신 위생 관련 문제는 관계 부서와의 협의를 통해 조속히 해결할 것을 약속드리며, 향후 유사한 불편이 재발하지 않도록 지속적인 실태 조사를 이어가겠습니다.\n\n교내 기숙사 발전을 위해 소중한 안건을 제출해 주신 점 다시 한번 감사드립니다." },
            { id: 28, dorm: "미래관, 남성 기숙사", category: "청소 및 위생", date: "2026-09-22 00:23:56", content: "현재 추가 학습실 내 에어컨 필터 및 내부 상태에 먼지 오염이 심각하여 위생상 문제가 발생하고 있습니다. 에어컨 가동 시 쾌쾌한 냄새가 나고, 공기 중으로 먼지나 곰팡이 균이 배출되어 학습실을 이용하는 학생들이 호흡기 불편함과 쾌적하지 못한 환경으로 어려움을 겪고 있습니다. 추가 학습실 에어컨의 필터 청소 및 전문적인 내부 분해 세척을 조속히 진행해 주시기를 요청드립니다. 학생들이 건강하고 쾌적한 환경에서 학습할 수 있도록 정기적인 위생 점검 및 관리도 함께 부탁드립니다.", replyStatus: "회신 필요", replyContent: "" },
            { id: 29, dorm: "미래관, 남성 기숙사", category: "청소 및 위생", date: "2026-09-22 00:27:54", content: "5층 추가학습실 중 오픈된 책상이 있는 방의 에어컨의 청소가 제대로 이뤄지지 않아 에어컨을 킬 시 곰팡이 냄새가 나는 문제점이 있습니다. 주기적인 에어컨 청소가 필요합니다.", replyStatus: "회신 완료", replyContent: "귀하께서 제기해 주신 안건은 ‘5층 추가학습실 내 에어컨 청소 미흡 및 곰팡이 냄새 개선 요청’에 관한 건으로 확인되었습니다.\n\n본 자치위원회에서는 해당 민원을 접수한 즉시 실태 조사를 진행하였으며, 조속한 조치의 필요성을 확인하였습니다. 현행 기숙사 방침상 에어컨 필터 청소가 연 1회 실시되고 있으나, 제기해 주신 것처럼 기존 주기로는 쾌적한 환경을 유지하기 어렵다는 점을 확인하였습니다.\n\n이에 자치위원회에서는 담당 지도교사 및 사감 교사께 해당 현장의 심각성을 전달하고 즉각적인 대책 마련을 요청하였습니다.\n\n그 결과, 문제가 제기된 5층 추가학습실 에어컨에 대해 조속한 시일 내 전문 분해 세척 및 살균 소독을 우선 집행하기로 협의를 완료하였습니다. 나아가 기숙사생 전체를 대상으로 실시될 ‘기숙사 위생 관리 실태 설문조사’를 통해 에어컨 정기 청소 주기 단축 및 위생 점검 정례화 방안을 학교 측과 지속해서 협의해 나갈 예정입니다.\n\n기숙사 자치위원회는 이번 에어컨 분해 세척 및 악취 제거 조치가 차질 없이 완료될 때까지 이행 경과를 점검하고, 추후 진행되는 상황에 의거하여 기숙사 내 전체 공지로 진행 상황을 전해드릴 예정입니다.\n\n소중한 의견에 깊이 감사드리며, 앞으로도 안전하고 쾌적한 기숙사 환경을 조성하는 데 최선을 다하겠습니다." },

            { id: 33, dorm: "미래관, 남성 기숙사", category: "시설 및 설비", date: "2026-09-23 16:00:11", content: "샤위기가 너무 별로입니다 제가 써본 샤워기 중에 진짜 제일 안 좋아요. 비데가 없는 곳이 너무 별로다", replyStatus: null, replyContent: "" }
        ];

        let petitions = [...initialPetitions];
        let isAdmin = false;

        // DOM 요소
        const cardsContainer = document.getElementById('cards-container');
        const searchInput = document.getElementById('search-input');
        const filterDorm = document.getElementById('filter-dorm');
        const filterCategory = document.getElementById('filter-category');
        const filterStatus = document.getElementById('filter-status');
        const statsSummary = document.getElementById('stats-summary');
        const btnAdminLogin = document.getElementById('btn-admin-login');
        const adminIndicator = document.getElementById('admin-indicator');
        const btnExcelUpload = document.getElementById('btn-excel-upload');
        const excelFileInput = document.getElementById('excel-file-input');

        // 카드 렌더링 함수
        function renderCards() {
            const query = searchInput.value.trim().toLowerCase();
            const dormVal = filterDorm.value;
            const categoryVal = filterCategory.value;
            const statusVal = filterStatus.value;

            const filtered = petitions.filter(item => {
                // 검색어 매칭 (ID, 기숙사, 카테고리, 날짜, 내용, 회신상태, 회신내용 전체)
                const searchTarget = `${item.id} ${item.dorm} ${item.category} ${item.date} ${item.content} ${item.replyStatus || ''} ${item.replyContent || ''}`.toLowerCase();
                const matchesSearch = !query || searchTarget.includes(query);

                // 기숙사 필터
                const matchesDorm = (dormVal === 'all') || item.dorm.includes(dormVal);

                // 카테고리 필터
                const matchesCategory = (categoryVal === 'all') || item.category === categoryVal;

                // 회신 상태 필터
                let matchesStatus = true;
                if (statusVal === '회신 대기') {
                    matchesStatus = (item.replyStatus === '회신 대기' || item.replyStatus === '회신 필요');
                } else if (statusVal === '회신 완료') {
                    matchesStatus = (item.replyStatus === '회신 완료');
                }

                return matchesSearch && matchesDorm && matchesCategory && matchesStatus;
            });

            statsSummary.textContent = `조회된 안건 : 총 ${filtered.length}건 (전체 ${petitions.length}건 중)`;

            if (filtered.length === 0) {
                cardsContainer.innerHTML = `<div class="no-result">검색 또는 필터 조건에 부합하는 안건이 존재하지 않습니다.</div>`;
                return;
            }

                const dormBadgeClass = item.dorm.includes('미래관') ? 'badge-mirae' : 'badge-cheongun';

                // 회신 대기 또는 회신 필요 건에 대해서만 작성 권한 부여
                const isPendingTarget = (item.replyStatus === '회신 대기' || item.replyStatus === '회신 필요');

                let statusBadgeHtml = '';
                if (item.replyStatus === '회신 대기' || item.replyStatus === '회신 필요') {
                    statusBadgeHtml = `<span class="reply-badge">${escapeHtml(item.replyStatus)}</span>`;
                } else if (item.replyStatus === '회신 완료') {
                    statusBadgeHtml = `<span class="done-badge">회신 완료</span>`;
                }

                let replyBoxHtml = '';
                if (item.replyStatus === '회신 완료' && item.replyContent) {
                    replyBoxHtml = `
                        <div class="reply-box">
                            <div class="reply-header">📌 [광주중앙고등학교 기숙사 자치위원회 회신]</div>

                // 관리자 인증 시 회신 대기 상태인 건만 작성 영역 표시

                    adminEditorHtml = `

                            <div style="font-size:11px; font-weight:700; color:#4338ca;">[관리자 권한] 회신 입력 및 수정</div>
                            <textarea id="admin-textarea-${item.id}" class="admin-reply-textarea" placeholder="건의사항에 대한 자치위원회 공식 회신문을 작성하세요...">${item.replyContent || ''}</textarea>
                            <button class="admin-save-btn" onclick="saveAdminReply(${item.id})">회신 내용 저장 및 등록</button>
                        </div>
                    `;
                }

                return `
                    <div class="card">
                        <div class="card-header">
                            <div class="badge-group">
                                <span class="badge-id">#${item.id}</span>
                                <span class="badge-dorm ${dormBadgeClass}">${item.dorm}</span>
                                <span class="category-badge">${item.category}</span>
                                ${statusBadgeHtml}
                            </div>
                            <span class="card-date">${item.date}</span>
                        </div>
                        <div class="card-body">
                            ${isLongContent ? `<input type="checkbox" id="card-${item.id}" class="toggle-input">` : ''}
                            <p class="card-content ${isLongContent ? 'expandable' : ''}">${escapeHtml(item.content)}</p>
                            ${isLongContent ? `<label for="card-${item.id}" class="more-btn"></label>` : ''}
                            ${replyBoxHtml}
                            ${adminEditorHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // HTML 태그 이스케이프 함수
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

                if (confirm("관리자 모드를 종료하시겠습니까?")) {
                    isAdmin = false;
                    adminIndicator.style.display = 'none';
                    btnAdminLogin.textContent = 'Administrator';
                    renderCards();
                }
                return;
            }

            const pwd = prompt("관리자 인증 비밀번호를 입력해 주세요.");

                adminIndicator.style.display = 'inline-block';
                btnAdminLogin.textContent = 'Administrator logout';
                alert("관리자 인증이 완료되었습니다.\n회신 대기 안건에 대한 회신 작성 기능이 활성화됩니다.");
                renderCards();
            } else if (pwd !== null) {
                alert("비밀번호가 올바르지 않습니다.");

            if (!textarea) return;
            const textVal = textarea.value.trim();

            if (!textVal) {
                alert("회신 내용을 입력해 주세요.");

            const target = petitions.find(p => p.id === id);
            if (target) {
                target.replyContent = textVal;
                target.replyStatus = "회신 완료";
                alert(`안건 #${id}에 대한 회신이 성공적으로 저장 처리되었습니다.`);
                renderCards();
            }
        };

        // Excel 업로드 처리
        btnExcelUpload.addEventListener('click', () => {
            excelFileInput.click();
        });

        excelFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    if (json.length < 2) {
                        alert("엑셀 파일 내 유효한 데이터가 없습니다.");
                        return;
                    }

                    // 헤더를 기반으로 데이터 컬럼 매핑
                    const headers = json[0];
                    let addedCount = 0;

                    for (let i = 1; i < json.length; i++) {
                        const row = json[i];
                        if (!row || row.length === 0) continue;

                        const date = row[0] || new Date().toISOString().replace('T', ' ').substring(0, 19);
                        const rawDorm = String(row[3] || '');
                        const rawCat = String(row[4] || '');
                        const content = String(row[5] || row[4] || '');

                        if (!content) continue;

                        // 기숙사 매핑
                        let dormStr = "미래관, 남성 기숙사";
                        if (rawDorm.includes("청운관") || rawDorm.includes("여성")) {
                            dormStr = "청운관, 여성 기숙사";
                        }

                        // 카테고리 매핑
                        let categoryStr = "기타";
                        if (rawCat.includes("규정") || rawCat.includes("점호") || rawCat.includes("벌점")) categoryStr = "생활 규정 및 점호";
                        else if (rawCat.includes("시설") || rawCat.includes("설비") || rawCat.includes("파손")) categoryStr = "시설 및 설비";
                        else if (rawCat.includes("청소") || rawCat.includes("위생") || rawCat.includes("방역")) categoryStr = "청소 및 위생";
                        else if (rawCat.includes("소음") || rawCat.includes("보안")) categoryStr = "소음 및 보안";

                        const nextId = petitions.length > 0 ? Math.max(...petitions.map(p => p.id)) + 1 : 1;

                        petitions.push({
                            id: nextId,
                            dorm: dormStr,
                            category: categoryStr,
                            date: String(date),
                            content: content,
                            replyStatus: "회신 대기",
                            replyContent: ""
                        });
                        addedCount++;
                    }

                    alert(`엑셀 파일로부터 총 ${addedCount}건의 건의사항이 성공적으로 추가되었습니다.`);
                    excelFileInput.value = '';
                    renderCards();

                } catch (err) {
                    console.error(err);
                    alert("엑셀 파일을 읽는 도중 오류가 발생하였습니다. 파일 형식을 확인하세요.");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // 실시간 검색 및 필터링 이벤트 리스너 등록
        searchInput.addEventListener('input', renderCards);
        filterDorm.addEventListener('change', renderCards);
        filterCategory.addEventListener('change', renderCards);
        filterStatus.addEventListener('change', renderCards);

        // 최초 실행
        renderCards();
    </script>
