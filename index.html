<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>광주중앙고등학교 기숙사 자치위원 협의 안건 중 건의 및 개선사항 제안서</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- SheetJS 라이브러리 (엑셀 업로드 파싱용) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Supabase client (다른 기기와 데이터 동기화용) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 테마 깜빡임 방지를 위해 CSS 적용 전에 먼저 저장된 테마를 반영 -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('gjcentral_dorm_theme_v1');
                var theme = (saved === 'dark' || saved === 'light')
                    ? saved
                    : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) { /* localStorage 사용 불가 시 기본 라이트 테마 유지 */ }
        })();
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --color-bg: #f7f5f0;
            --color-card-bg: #fdfbf7;
            --color-text: #3b3028;
            --color-text-muted: #6e6155;
            --color-text-faint: #8c7f73;
            --color-border: #e2d9cd;
            --color-border-soft: #d5c8b8;

            --color-header-bg: #2c221e;
            --color-header-text: #fdfbf7;
            --color-header-subtext: #d1c2b4;

            --color-accent: #8c6d58;
            --color-accent-dark: #5c4033;
            --color-accent-darker: #422d24;

            --color-excel: #6e7855;
            --color-excel-hover: #576043;

            --color-input-bg: #ffffff;

            --shadow-header: 0 4px 12px rgba(44, 34, 30, 0.15);
            --shadow-panel: 0 2px 8px rgba(60, 48, 38, 0.04);
            --shadow-card: 0 2px 6px rgba(60, 48, 38, 0.04);
            --shadow-card-hover: 0 4px 12px rgba(60, 48, 38, 0.08);
            --shadow-modal: 0 12px 32px rgba(44, 34, 30, 0.22);

            --badge-id-bg: #efebe4; --badge-id-text: #5c4033; --badge-id-border: #d5c8b8;
            --badge-mirae-bg: #eaf1f7; --badge-mirae-text: #2e5178; --badge-mirae-border: #c8d8ea;
            --badge-cheongun-bg: #f3e5e1; --badge-cheongun-text: #7a3e35; --badge-cheongun-border: #e2c4be;
            --badge-category-bg: #f0ebe1; --badge-category-text: #5c5248; --badge-category-border: #dfd6c8;
            --badge-reply-bg: #fdf6e7; --badge-reply-text: #8c5311; --badge-reply-border: #f0d5a3;
            --badge-done-bg: #edf3eb; --badge-done-text: #3b5e3d; --badge-done-border: #c7dcc5;
            --badge-new-bg: #fdece7; --badge-new-text: #a8431f; --badge-new-border: #f3c7b6;

            --reply-box-bg: #f4efe6; --reply-box-border: #dbcfc0; --reply-box-header: #5c4033; --reply-box-text: #2c221e;

            --mark-bg: #ffe08a; --mark-text: #3b3028;

            --toast-bg: #2c221e; --toast-text: #fdfbf7;
            --toast-success: #6e9c6f; --toast-error: #b5564a; --toast-warning: #c99a3a; --toast-info: #8c6d58;

            --stats-fill: #8c6d58;
        }

        [data-theme="dark"] {
            --color-bg: #1c1712;
            --color-card-bg: #29221b;
            --color-text: #ece4d8;
            --color-text-muted: #b8a996;
            --color-text-faint: #93866f;
            --color-border: #443626;
            --color-border-soft: #52422e;

            --color-header-bg: #120d0a;
            --color-header-text: #f7f2ea;
            --color-header-subtext: #c9b6a1;

            --color-accent: #caa274;
            --color-accent-dark: #dcb98b;
            --color-accent-darker: #ecd0a4;

            --color-excel: #93a56c;
            --color-excel-hover: #a7b884;

            --color-input-bg: #241d16;

            --shadow-header: 0 4px 14px rgba(0, 0, 0, 0.45);
            --shadow-panel: 0 2px 10px rgba(0, 0, 0, 0.3);
            --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-card-hover: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-modal: 0 16px 40px rgba(0, 0, 0, 0.55);

            --badge-id-bg: #3a2f22; --badge-id-text: #e8d8c3; --badge-id-border: #52422e;
            --badge-mirae-bg: #1f2c3a; --badge-mirae-text: #a1c3df; --badge-mirae-border: #2d4258;
            --badge-cheongun-bg: #3a2621; --badge-cheongun-text: #e5ac9e; --badge-cheongun-border: #4d322c;
            --badge-category-bg: #332a1e; --badge-category-text: #dccdb7; --badge-category-border: #4a3c29;
            --badge-reply-bg: #392c14; --badge-reply-text: #e8ba6c; --badge-reply-border: #59461f;
            --badge-done-bg: #22301f; --badge-done-text: #9dcb9c; --badge-done-border: #334a2f;
            --badge-new-bg: #392015; --badge-new-text: #f1a884; --badge-new-border: #59321f;

            --reply-box-bg: #2e2519; --reply-box-border: #4a3c29; --reply-box-header: #dfc49b; --reply-box-text: #ece4d8;

            --mark-bg: #6b5320; --mark-text: #fff3d6;

            --toast-bg: #efe6d9; --toast-text: #2c221e;
            --toast-success: #9fce9c; --toast-error: #e29a8d; --toast-warning: #e8c479; --toast-info: #caa274;

            --stats-fill: #caa274;
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Nanum Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        button, input, select, textarea { font-family: inherit; }

        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 2px solid var(--color-accent-dark);
            outline-offset: 2px;
        }

        header {
            background-color: var(--color-header-bg);
            color: var(--color-header-text);
            padding: 24px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-header);
            border-bottom: 2px solid var(--color-accent);
            transition: background-color 0.2s ease;
        }
        .header-container {
            max-width: 1150px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header-title {
            font-size: 16px;
            font-weight: 800;
            word-break: keep-all;
            color: var(--color-header-text);
        }
        .header-subtitle {
            font-size: 13px;
            color: var(--color-header-subtext);
            margin-top: 6px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-theme {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background-color: rgba(255, 255, 255, 0.06);
            color: var(--color-header-text);
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }
        .btn-theme:hover { background-color: rgba(255, 255, 255, 0.14); }

        .admin-status {
            font-size: 12px;
            background-color: var(--color-accent-dark);
            color: #f7f5f0;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid var(--color-accent);
        }

        /* 컨트롤 패널 (검색, 필터, 버튼) */
        .control-panel {
            max-width: 1150px;
            margin: 20px auto 0 auto;
            padding: 0 16px;
        }
        .control-panel + .control-panel { margin-top: 12px; }

        .panel-card {
            background: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow-panel);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .search-bar-wrap { width: 100%; }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 13px;
            border: 1px solid var(--color-border-soft);
            background-color: var(--color-input-bg);
            color: var(--color-text);
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
        }
        .search-input:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(140, 109, 88, 0.15);
        }
        .filter-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }
        .filter-group { display: flex; gap: 8px; flex-wrap: nowrap; align-items: center; min-width: 0; }
        .filter-select {
            padding: 8px 12px;
            font-size: 12px;
            font-family: inherit;
            border: 1px solid var(--color-border-soft);
            border-radius: 6px;
            background-color: var(--color-input-bg);
            color: var(--color-text);
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }
        .filter-select:focus { border-color: var(--color-accent); }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn {
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        .btn-admin { background-color: var(--color-accent-dark); color: #f7f5f0; }
        .btn-admin:hover { background-color: var(--color-accent-darker); }
        .btn-excel { background-color: var(--color-excel); color: #ffffff; }
        .btn-excel:hover { background-color: var(--color-excel-hover); }
        .btn-print { background-color: transparent; color: var(--color-accent-dark); border: 1px solid var(--color-border-soft); }
        .btn-print:hover { background-color: var(--color-border); }

        /* 통계 패널 */
        @media (min-width: 640px) {
        }

        main {
            max-width: 1150px;
            margin: 0 auto;
            padding: 20px 16px 40px 16px;
        }

        .stats-summary {
            font-size: 13px;
            color: var(--color-text-muted);
            margin-bottom: 16px;
            font-weight: 700;
        }

        /* 메이슨리(Masonry) 다단 레이아웃 설정 */
        .cards-grid { column-count: 1; column-gap: 16px; margin-bottom: 40px; }
        @media (min-width: 768px) { .cards-grid { column-count: 2; } }

        .card {
            background-color: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 18px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
            break-inside: avoid;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s ease, border-color 0.2s ease;
        }
        .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card-hover); }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .badge-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .badge-id {
            background-color: var(--badge-id-bg); color: var(--badge-id-text);
            font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px;
            border: 1px solid var(--badge-id-border);
        }
        .badge-dorm { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; }
        .badge-mirae { background-color: var(--badge-mirae-bg); color: var(--badge-mirae-text); border: 1px solid var(--badge-mirae-border); }
        .badge-cheongun { background-color: var(--badge-cheongun-bg); color: var(--badge-cheongun-text); border: 1px solid var(--badge-cheongun-border); }

        .category-badge {
            font-size: 11px; font-weight: 700; color: var(--badge-category-text);
            background-color: var(--badge-category-bg); padding: 4px 8px; border-radius: 6px;
            border: 1px solid var(--badge-category-border);
        }
        .reply-badge {
            font-size: 11px; font-weight: 700; color: var(--badge-reply-text);
            background-color: var(--badge-reply-bg); padding: 4px 8px; border-radius: 6px;
            border: 1px solid var(--badge-reply-border);
        }
        .done-badge {
            font-size: 11px; font-weight: 700; color: var(--badge-done-text);
            background-color: var(--badge-done-bg); padding: 4px 8px; border-radius: 6px;
            border: 1px solid var(--badge-done-border);
        }
        .new-badge {
            font-size: 11px; font-weight: 700; color: var(--badge-new-text);
            background-color: var(--badge-new-bg); padding: 4px 8px; border-radius: 6px;
            border: 1px solid var(--badge-new-border);
        }
        .reply-status-badge { background: #fff7df; color: #7a5b00; border: 1px solid #e6cf7a; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
        .reply-status-done { background: #e7f5ec; color: #28734a; border-color: #a9d7bb; }

        .card-date { font-size: 11px; color: var(--color-text-faint); }

        .card-body { display: flex; flex-direction: column; flex-grow: 1; }

        .card-content {
            font-size: 13px;
            color: var(--color-text);
            white-space: pre-wrap;
            word-break: break-word;
            margin-top: 6px;
            line-height: 1.6;
            overflow: hidden;
            max-height: 95px;
            position: relative;
            transition: max-height 0.3s ease;
        }
        .card-content.expandable::after {
            content: "";
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 35px;
            background: linear-gradient(transparent, var(--color-card-bg));
            pointer-events: none;
        }
        .card-content.expanded { max-height: 2000px !important; }
        .card-content.expanded::after { display: none; }

        .card-content mark, .reply-content mark {
            background-color: var(--mark-bg);
            color: var(--mark-text);
            border-radius: 2px;
            padding: 0 1px;
        }

        .more-btn {
            background: none; border: none; color: var(--color-accent);
            font-family: 'Nanum Gothic', sans-serif; font-size: 12px; font-weight: 700;
            cursor: pointer; padding: 8px 0 0 0; align-self: flex-start; margin-top: 4px;
            display: inline-block; user-select: none;
        }
        .more-btn:hover { text-decoration: underline; color: var(--color-accent-dark); }

        .reply-box {
            margin-top: 14px; padding: 12px 14px;
            background-color: var(--reply-box-bg);
            border: 1px solid var(--reply-box-border);
            border-radius: 8px;
        }
        .reply-header {
            font-size: 12px; font-weight: 700; color: var(--reply-box-header);
            margin-bottom: 6px; display: flex; align-items: center; gap: 4px;
        }
        .reply-content {
            font-size: 12px; color: var(--reply-box-text);
            white-space: pre-wrap; word-break: break-word; line-height: 1.6;
        }

        .admin-reply-editor {
            margin-top: 14px; padding: 12px;
            background-color: var(--color-bg);
            border: 1px dashed var(--color-accent);
            border-radius: 8px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .admin-reply-editor-label { font-size: 11px; font-weight: 700; color: var(--color-accent-dark); }
        .admin-reply-textarea {
            width: 100%; min-height: 90px; padding: 8px;
            font-family: inherit; font-size: 12px;
            border: 1px solid var(--color-border-soft); border-radius: 6px;
            resize: vertical;
            background-color: var(--color-input-bg); color: var(--color-text);
            outline: none;
        }
        .admin-reply-textarea:focus { border-color: var(--color-accent); }
        .admin-save-btn {
            align-self: flex-end; padding: 6px 12px;
            background-color: var(--color-accent-dark); color: #ffffff;
            font-size: 11px; font-weight: 700; border: none; border-radius: 4px;
            cursor: pointer; transition: background-color 0.2s;
        }
        .admin-save-btn:hover { background-color: var(--color-accent-darker); }

        .no-result {
            text-align: center; padding: 40px; color: var(--color-text-faint);
            font-size: 14px; background: var(--color-card-bg); border-radius: 12px;
            border: 1px dashed var(--color-border-soft);
        }

        footer {
            background-color: var(--color-card-bg);
            border-top: 1px solid var(--color-border);
            padding: 24px; text-align: center; font-size: 13px;
            color: var(--color-text-muted); font-weight: 700;
        }

        /* 맨 위로 버튼 */
        .back-to-top {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid var(--color-border-soft);
            background-color: var(--color-accent-dark);
            color: #fdfbf7;
            font-size: 16px;
            cursor: pointer;
            box-shadow: var(--shadow-card-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease, background-color 0.2s;
            z-index: 90;
        }
        .back-to-top.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .back-to-top:hover { background-color: var(--color-accent-darker); }

        /* 토스트 알림 */
        .toast-container {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 200;
            width: min(92vw, 380px);
            align-items: stretch;
        }
        .toast {
            background-color: var(--toast-bg);
            color: var(--toast-text);
            border-left: 4px solid var(--toast-info);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-modal);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { border-left-color: var(--toast-success); }
        .toast-error { border-left-color: var(--toast-error); }
        .toast-warning { border-left-color: var(--toast-warning); }
        .toast-icon { flex-shrink: 0; }
        .toast-msg { word-break: keep-all; }

        /* 엑셀 업로드 미리보기 모달 */
        .modal-overlay {
            position: fixed; inset: 0;
            background-color: rgba(28, 23, 18, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 300;
        }
        .modal-card {
            background-color: var(--color-card-bg);
            border-radius: 14px;
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-modal);
            width: min(100%, 560px);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 18px;
            border-bottom: 1px solid var(--color-border);
        }
        .modal-header h2 { font-size: 14px; font-weight: 800; color: var(--color-text); }
        .modal-close {
            background: none; border: none; cursor: pointer;
            font-size: 15px; color: var(--color-text-muted); line-height: 1;
            padding: 4px;
        }
        .modal-close:hover { color: var(--color-text); }
        .modal-body { padding: 16px 18px; overflow-y: auto; }
        .modal-summary { font-size: 12px; color: var(--color-text-muted); margin-bottom: 12px; word-break: keep-all; }
        .excel-preview-list { display: flex; flex-direction: column; gap: 10px; }
        .excel-preview-item {
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 10px 12px;
            background-color: var(--color-bg);
        }
        .excel-preview-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
        .excel-preview-content { font-size: 12px; color: var(--color-text); word-break: break-word; }
        .modal-footer {
            display: flex; justify-content: flex-end; gap: 8px;
            padding: 14px 18px;
            border-top: 1px solid var(--color-border);
        }
        .btn-modal-cancel { background-color: var(--color-border); color: var(--color-text); }
        .btn-modal-cancel:hover { background-color: var(--color-border-soft); }

            { id: 19, dorm: "청운관, 여성 기숙사", category: "청소 및 위생", date: "2026-09-21 22:34:20", content: "화장실 변기 물 안내리는것과 샤워실 벽면에 여드름패치 붙이기, 샤워실에서 소변누기 등과 같은것들이 고쳐졌으면 좋겠습니다", replyStatus: null, replyContent: "" },
            { id: 20, dorm: "미래관, 남성 기숙사", category: "생활 규정 및 점호", date: "2026-09-21 22:38:44", content: "벌점 고득자 투표제(퇴소,10점 이상의 벌점 부과등)\n기숙사는 학교와 집 사이 거리가 멀어 통학이 어려운 학생들의 통학을 편히하게 위해 만든 시설이라고 생각합니다.\n그런 장거리 통학생들에게 제일 큰 타격을 주는 형벌은 퇴소라고 생각합니다. 기숙사생들 중에는 통학거리가 집과 가까운 학생도 있는 반면에 집과 거리가 먼 학샹들도 많이 있습니다. 집과 학교사이에 통학거리가 먼 경우 기숙사 퇴소시에는 학업에도 차질이 생길 수 있으며 성찰교실에도 갈 수 있습니다. 이런 부분은 장거리 통학 학생들의 학업을 방해할 뿐더러 학생들의 학습권을 보장하는 역할을 하는 기숙사의 취지와는 좀 엇나가는 것 같다는 개인적인 의문이 듭니다. 물론 벌점을 먹는 여러 이유 중 다른 학샹들과 사용하는 공간이니만큼 다른 학생들을 배려하는 규칙이 있고 개인의 안전을 위한 규칙,등 여러 학생을 위한 규칙이 마련되어있어 이러한 규칙을 어긴 학생의 벌점이 부당하다는것은 아닙니다.\n하지만 기숙사 생활을 하며 여러가지 벌점 사례를 보았는데 그중제가 문제삼고 싶은점은 사감선생님의 감정적인 벌점 부과입니다. 지금까지 기숙사에 생활하며 벌점 받을 사유긴 하지만 그에비해 너무 높은 벌점을 받은 사례가 몇몇 있었고 어떤날은 사감선생님의 감시가 삼엄해지는 날도 있었습니다. 예를들어 소등 이후 사감선생님께서 방에 후레쉬를 비추시며 들어와 잠들려던 학샹들이게 비추는 경우도 있었습니다. 여자 기숙사에서는 이런 경우가 있는지는 잘 모르겠으나 안전이라는 이유로 자야될 학생들 침대에 후레쉬를 비추는 경우는 잘못된것 같습니다. 본론으로 돌아와서 벌점을 10점 이상 한번에 받게 되어 퇴사 점수에 달성한 학생에대해 카카오톡 투표방에서 학생들이 투표하여 결정하는것이 제가 생각해본 방법입니다. 왜이런 생각을 하냐면 벌점은 다른 학생에게 방해가 되는 행동을 한 경우 먹게되는데 만약 다른 학생들의 기분과는 상관없이 사감선생님의 개인적인 감정으로 발점이 부과되는것에 대해 다른 학생들이 직접 판단 후 퇴사가 결정되는것이 벌점의 취지에 맞다고 생각됩니다. 귀찮다고 생각될 수 있지만 그 학생에 대해서는 주변 학생들이 제일 잘 압니다. 그 행동이 무심코 잘못나오게된 행동인지, 의도적으로 악의적인 의도로 지속된 행위인지 그 주변 학생들이 제일 잘알기에 판단이 잘못될 경우는 드물것 같습니다. 귀찮아보여도 기숙사에서 억울한 일이 줄어들기 바라는 마음으로 건의 드립니다. 긴글 읽어주셔서 감사합니다.", replyStatus: "회신 대기", replyContent: "" },
            { id: 21, dorm: "미래관, 남성 기숙사", category: "기타", date: "2026-09-21 22:42:08", content: "가족과의 연락, 학교 공지사항 확인, 건강 및 생활 정보 검색 등 기본적 생활 지원을 위해 안정적인 네트워크가 필요하다. 또 방과 후 취미 활동, 뉴스 시청, 문화 콘텐츠 이용 등 정서적 안정과 스트레스 해소를 위해서도 인터넷 연결이 중요한 요소다", replyStatus: null, replyContent: "" },

            { id: 26, dorm: "청운관, 여성 기숙사", category: "생활 규정 및 점호", date: "2026-09-21 23:44:59", content: "추공실에 제발 와이π 좀 해주세요 고딩이나 되어서 추공실에서 게임하고 놀려는 것이 아니라 피피티를 만들거나 보고서를 쓰거나 자료조사를 하거나 검색을 해야할 때가 많은데 너무 불편합니다", replyStatus: null, replyContent: "" },

                const { data, error } = await supabase.from('petitions').select('*').order('id', { ascending: true });
                if (error) throw error;
                const rows = Array.isArray(data) ? data : [];
                const petitionRows = rows.filter(row => Number(row.id) > 0);
                if (petitionRows.length) {
                    petitions = petitionRows.map(cloudRowToPetition);
                    savePetitionsLocal();
                    renderCards();
                    return true;
                }
                // Cloud에 실제 안건 행이 없더라도 로컬의 기존 안건을 비우지 않는다.
                // 클라우드에 실제 안건 행이 없더라도 로컬의 기존 안건을 유지한다.
                if (!Array.isArray(petitions) || petitions.length === 0) {
                    petitions = JSON.parse(JSON.stringify(initialPetitions)).map(normalizePetition);
                    savePetitionsLocal();
                }
                renderCards();
                if (options.seedIfEmpty && isAdmin && petitions.length) {
                    await savePetitionsCloud();
                }
                return petitions.length > 0;
            } catch (e) {
                console.error('Supabase 불러오기 오류:', e);
                if (!options.silent) showToast('Cloud data could not be loaded. Local data is being shown.', 'warning', 4200);
                return false;
            }
        }

        async function setupCloudSubscription() {
            if (!supabase || cloudSubscription) return;
            cloudSubscription = supabase.channel('petitions-live-sync')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'petitions' }, async () => {
                    if (!cloudSyncInProgress) await refreshFromCloud({ silent: true });
                })
                .subscribe();
        }

        async function initializeCloud() {
            if (!supabase) return;
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                isAdmin = true;
                setAdminSession();
                adminIndicator.style.display = 'inline-block';

            }
            await refreshFromCloud({ seedIfEmpty: !!session });
            await setupCloudSubscription();
        }

        let petitions = loadPetitions();

        // ── 유틸 함수 ─────────────────────────────────────────────
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // 검색어를 HTML 이스케이프 후 <mark>로 감싸 하이라이트
        function highlightText(rawText, query) {
            const escaped = escapeHtml(rawText);
            if (!query) return escaped;
            const escapedQuery = escapeHtml(query);
            const pattern = escapeRegex(escapedQuery);
            if (!pattern) return escaped;
            try {
                const regex = new RegExp(pattern, 'gi');
                return escaped.replace(regex, (match) => `<mark>${match}</mark>`);
            } catch (e) {
                return escaped;
            }
        }

        function getDateValue(item) {
            const cleaned = String(item.date || '').replace('(수정)', '').trim().replace(' ', 'T');
            const t = new Date(cleaned).getTime();
            return isNaN(t) ? 0 : t;
        }

        function formatDateOnly(dateValue) {
            const d = new Date(dateValue);
            if (isNaN(d.getTime())) return '';
            return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
        }

        function compareItems(a, b, sortVal) {
            switch (sortVal) {
                case 'date_desc': return getDateValue(b) - getDateValue(a);
                case 'date_asc': return getDateValue(a) - getDateValue(b);
                case 'dorm': {
                    if (a.dorm === b.dorm) return a.id - b.id;
                    return a.dorm.localeCompare(b.dorm, 'ko');
                }
                default: return a.id - b.id;
            }
        }

        function getFilteredPetitions() {
            const query = searchInput.value.trim().toLowerCase();
            const dormVal = filterDorm.value;
            const categoryVal = filterCategory.value;
            const statusVal = filterStatus.value;
            const priorityVal = filterPriority.value;
            const filtered = petitions.filter(item => {
                const searchTarget = `${item.id} ${item.dorm} ${item.category} ${item.date} ${item.content} ${item.status || ''} ${item.replyStatus || ''} ${item.priority || ''} ${item.replyContent || ''}`.toLowerCase();
                const matchesSearch = !query || searchTarget.includes(query);
                const matchesDorm = dormVal === 'all' || item.dorm.includes(dormVal);
                const matchesCategory = categoryVal === 'all' || item.category === categoryVal;
                const matchesPriority = priorityVal === 'all' || item.priority === priorityVal;
                let matchesStatus = true;
                if (statusVal !== 'all') {
                    matchesStatus = item.status === statusVal || (statusVal === '회신 대기' && (item.replyStatus === '회신 대기' || item.replyStatus === '회신 필요'));
                }
                return matchesSearch && matchesDorm && matchesCategory && matchesStatus && matchesPriority;
            });
            filtered.sort((a,b) => compareItems(a,b,filterSort.value));
            return filtered;
        }

        function getPrintItems() {
            if (printRange === 'all') return petitions.filter(p => p.status === '조치 완료').sort((a,b) => a.id-b.id);
            if (printRange === 'pending') return petitions.filter(p => p.status !== '조치 완료').sort((a,b) => a.id-b.id);
            return getFilteredPetitions();
        }

        // ── 카드 렌더링 ───────────────────────────────────────────
        function renderCards() {
            const rawQuery = searchInput.value.trim();
            const filtered = document.body.classList.contains('print-preview-mode') ? getPrintItems() : getFilteredPetitions();
            statsSummary.textContent = `조회된 안건 : ${filtered.length}건 (총 ${petitions.length}건 중)`;

            if (filtered.length === 0) {
                cardsContainer.innerHTML = `<div class="no-result">검색 또는 필터 조건에 부합하는 안건이 존재하지 않습니다.</div>`;
                return;
            }

            cardsContainer.innerHTML = filtered.map(item => {
                const dormBadgeClass = item.dorm.includes('미래관') ? 'badge-mirae' : 'badge-cheongun';
                const processStatus = item.status === '검토 중' ? '접수' : (['접수','학교 전달','조치 예정','조치 완료'].includes(item.status) ? item.status : '접수');
                const replyStatus = item.replyStatus === '회신 완료' ? '회신 완료' : (item.replyStatus === '회신 대기' ? '회신 대기' : null);
                const isReplyDone = replyStatus === '회신 완료';

                const newBadgeHtml = '';
                const priorityBadgeHtml = item.priority && item.priority !== '미지정' ? `<span class="priority-badge ${item.priority === '긴급 처리' ? 'priority-urgent' : ''}">${escapeHtml(item.priority)}</span>` : '';
                const statusBadgeHtml = `<span class="status-badge ${processStatus === '조치 완료' ? 'status-done' : ''}">${escapeHtml(processStatus)}</span>`;
                const replyStatusBadgeHtml = replyStatus ? `<span class="reply-status-badge ${isReplyDone ? 'reply-status-done' : ''}">${escapeHtml(replyStatus)}</span>` : '';
                const replyBoxHtml = isReplyDone && item.replyContent ? `
                    <div class="reply-box">
                        <div class="reply-header">📌 [광주중앙고등학교 기숙사 자치위원회 회신]</div>
                        <div class="reply-content">${highlightText(item.replyContent, rawQuery)}</div>
                    </div>` : '';

                let adminEditorHtml = '';
                if (isAdmin && !document.body.classList.contains('print-preview-mode')) {
                    const history = Array.isArray(item.replyHistory) ? item.replyHistory : [];
                    const historyHtml = history.length ? `<details class="history-box"><summary>Reply & Processing Change History (${history.length})</summary>${history.slice().reverse().map(h => `<div class="history-item"><strong>${escapeHtml(h.at || '')}</strong><br>${escapeHtml(h.summary || '')}</div>`).join('')}<button type="button" class="history-reset-btn" onclick="clearReplyHistory(${item.id})">Reset History</button></details>` : '';
                    const draft = getDraft(item.id);
                    const replyEnabled = replyStatus === '회신 대기';
                    adminEditorHtml = `
                        <div class="admin-reply-editor">
                            <div class="admin-reply-editor-label">[Administrator] Reply & Processing Management</div>
                            <div class="admin-field-row admin-field-row-three">
                                <div class="admin-field"><label for="process-status-${item.id}">처리 상태</label><select id="process-status-${item.id}">
                                    ${['접수','학교 전달','조치 예정','조치 완료'].map(v => `<option value="${v}" ${processStatus===v?'selected':''}>${v}</option>`).join('')}
                                </select></div>
                                <div class="admin-field"><label for="reply-status-${item.id}">회신 상태</label><select id="reply-status-${item.id}">
                                    ${['','회신 대기','회신 완료'].map(v => `<option value="${v}" ${replyStatus===v?'selected':''}>${v || '미지정'}</option>`).join('')}
                                </select></div>
                                <div class="admin-field"><label for="priority-${item.id}">우선순위</label><select id="priority-${item.id}">
                                    ${['긴급','우선','일반'].map(v => `<option value="${v}" ${(item.priority||'일반')===v?'selected':''}>${v}</option>`).join('')}
                                </select></div>
                            </div>
                            ${replyEnabled ? `<textarea id="admin-textarea-${item.id}" class="admin-reply-textarea" placeholder="건의사항에 대한 자치위원회 공식 회신문을 작성하세요...">${escapeHtml(draft !== null ? draft : (item.replyContent || ''))}</textarea>
                            <div id="draft-note-${item.id}" class="draft-note">${draft !== null ? '임시 저장된 회신 초안을 불러왔습니다.' : '입력 내용은 자동으로 임시 저장됩니다.'}</div>` : ''}
                            <button class="admin-save-btn" onclick="saveAdminReply(${item.id})">처리 내용 저장 및 등록</button>
                            ${historyHtml}
                        </div>`;
                }

                return `
                    <div class="card" data-id="${item.id}">
                        <div class="card-header">
                            <div class="badge-group">
                                <span class="badge-id">#${item.id}</span>
                                <span class="badge-dorm ${dormBadgeClass}">${escapeHtml(item.dorm)}</span>
                                <span class="category-badge">${escapeHtml(item.category)}</span>
                                ${statusBadgeHtml}
                                ${replyStatusBadgeHtml}
                                ${priorityBadgeHtml}
                            </div>
                            <span class="card-date">${escapeHtml(item.date)}</span>
                        </div>
                        <div class="card-body">
                            <div class="card-content expandable" id="content-${item.id}">${highlightText(item.content, rawQuery)}</div>
                            <button class="more-btn" id="btn-more-${item.id}" onclick="toggleCard(${item.id})">더보기</button>
                            ${replyBoxHtml}
                            ${adminEditorHtml}
                        </div>
                    </div>`;
            }).join('');

            if (isAdmin && !document.body.classList.contains('print-preview-mode')) {
                filtered.forEach(item => {
                    const ta = document.getElementById(`admin-textarea-${item.id}`);
                    if (ta) ta.addEventListener('input', () => scheduleDraftSave(item.id, ta.value));
                });
            }
            checkContentOverflow();
        }

        function checkContentOverflow() {
            const contents = cardsContainer.querySelectorAll('.card-content');
            contents.forEach(contentEl => {
                const id = contentEl.id.replace('content-', '');
                const btn = document.getElementById(`btn-more-${id}`);

                contentEl.classList.add('expanded');
                const fullHeight = contentEl.scrollHeight;
                contentEl.classList.remove('expanded');

                if (fullHeight <= 105) {
                    contentEl.classList.remove('expandable');
                    if (btn) btn.style.display = 'none';
                } else {
                    contentEl.classList.add('expandable');
                    if (btn) btn.style.display = 'inline-block';
                }
            });
        }

        window.toggleCard = function (id) {
            const contentEl = document.getElementById(`content-${id}`);
            const btn = document.getElementById(`btn-more-${id}`);

            if (contentEl.classList.contains('expanded')) {
                contentEl.classList.remove('expanded');
                btn.textContent = '더보기';
            } else {
                contentEl.classList.add('expanded');
                btn.textContent = '접기';
            }
        };

        // ── 토스트 알림 ───────────────────────────────────────────
        function showToast(message, type = 'info', duration = 3800) {
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            const icons = { success: '', error: '', warning: '', info: '' };
            el.innerHTML = `<span class="toast-icon">${icons[type] || icons.info}</span><span class="toast-msg">${escapeHtml(message)}</span>`;
            toastContainer.appendChild(el);
            requestAnimationFrame(() => el.classList.add('show'));
            setTimeout(() => {
                el.classList.remove('show');
                setTimeout(() => el.remove(), 300);
            }, duration);
        }

        // ── 관리자 로그인 및 세션 ─────────────────────────────────
        function hashText(text) {
            return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join(''));
        }

        function updateAdminLoginMode() {
            const cloudMode = !!supabase;
            adminEmailInput.style.display = cloudMode ? 'block' : 'none';
            adminLoginSummary.textContent = cloudMode
                ? 'Enter the administrator email and password to access administrative features.'
                : 'Enter the administrator password to access administrative features.';
        }

        function closeAdminLoginModal() {
            adminLoginOverlay.style.display = 'none';
            adminPasswordInput.value = '';
            adminLoginError.textContent = '';
        }

        function openAdminLoginModal() {
            updateAdminLoginMode();
            adminLoginOverlay.style.display = 'flex';
            adminLoginError.textContent = '';
            setTimeout(() => (supabase ? adminEmailInput : adminPasswordInput).focus(), 50);
        }

        function setAdminSession() {
            try { sessionStorage.setItem(ADMIN_SESSION_KEY, String(Date.now() + ADMIN_SESSION_MS)); } catch(e) {}
        }

        function clearAdminSession() { try { sessionStorage.removeItem(ADMIN_SESSION_KEY); } catch(e) {} }

        async function restoreAdminSession() {
            try {
                if (supabase) {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) {
                        isAdmin = true; setAdminSession(); adminIndicator.style.display = 'inline-block'; btnAdminLogin.textContent = 'Administrator Logout'; return true;
                    }
                    return false;
                }
                const expires = Number(sessionStorage.getItem(ADMIN_SESSION_KEY));
                if (expires && expires > Date.now()) { isAdmin = true; adminIndicator.style.display = 'inline-block'; btnAdminLogin.textContent = 'Administrator Logout'; return true; }
                sessionStorage.removeItem(ADMIN_SESSION_KEY);
            } catch(e) {}
            return false;
        }

        async function logoutAdmin(message = 'Administrator session ended.') {
            if (supabase) {
                try { await supabase.auth.signOut(); } catch(e) { console.error(e); }
            }
            isAdmin = false; clearAdminSession(); adminIndicator.style.display = 'none'; btnAdminLogin.textContent = 'Administrator'; renderCards(); if (message) showToast(message, 'info');
        }

        btnAdminLogin.addEventListener('click', () => {
            if (isAdmin) { logoutAdmin(); return; }
            openAdminLoginModal();
        });
        document.getElementById('btn-admin-login-close').addEventListener('click', closeAdminLoginModal);
        document.getElementById('btn-admin-login-cancel').addEventListener('click', closeAdminLoginModal);
        adminLoginOverlay.addEventListener('click', e => { if (e.target === adminLoginOverlay) closeAdminLoginModal(); });
        document.getElementById('btn-admin-login-submit').addEventListener('click', async () => {
            const pwd = adminPasswordInput.value;
            if (!pwd) { adminLoginError.textContent = 'Please enter the administrator password.'; return; }
            try {
                if (supabase) {
                    const email = adminEmailInput.value.trim();
                    if (!email) { adminLoginError.textContent = 'Please enter the administrator email.'; adminEmailInput.focus(); return; }
                    const { error } = await supabase.auth.signInWithPassword({ email, password: pwd });
                    if (error) throw error;
                    isAdmin = true; setAdminSession(); adminIndicator.style.display = 'inline-block'; btnAdminLogin.textContent = 'Administrator Logout'; closeAdminLoginModal();
                    await refreshFromCloud({ seedIfEmpty: true });
                    await setupCloudSubscription();
                    showToast('Administrator authentication successful. Cloud synchronization is active.', 'success');
                    renderCards();
                } else {
                    const hash = await hashText(pwd);
                    if (hash === ADMIN_PASSWORD_HASH) {
                        isAdmin = true; setAdminSession(); adminIndicator.style.display = 'inline-block'; btnAdminLogin.textContent = 'Administrator Logout'; closeAdminLoginModal(); showToast('Administrator authentication successful. Session valid for 30 minutes.', 'success'); renderCards();
                    } else { adminLoginError.textContent = 'Incorrect password.'; adminPasswordInput.select(); }
                }
            } catch(e) {
                console.error(e);
                adminLoginError.textContent = supabase ? 'Authentication failed. Check your email and password.' : 'Browser authentication is unavailable.';
            }
        });
        adminPasswordInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-admin-login-submit').click(); if (e.key === 'Escape') closeAdminLoginModal(); });
        adminEmailInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-admin-login-submit').click(); if (e.key === 'Escape') closeAdminLoginModal(); });

        if (supabase) {
            supabase.auth.onAuthStateChange(async (_event, session) => {
                if (session) {
                    isAdmin = true; setAdminSession(); adminIndicator.style.display = 'inline-block'; btnAdminLogin.textContent = 'Administrator Logout';
                } else if (isAdmin) {
                    isAdmin = false; clearAdminSession(); adminIndicator.style.display = 'none'; btnAdminLogin.textContent = 'Administrator'; renderCards();
                }
            });
        }

        setInterval(() => {
            if (supabase) return;
            try {
                const expires = Number(sessionStorage.getItem(ADMIN_SESSION_KEY));
                if (isAdmin && (!expires || expires <= Date.now())) logoutAdmin('Administrator session expired.');
            } catch(e) {}
        }, 15000);

        // ── 회신 초안 자동 저장 ─────────────────────────────────
        function readDrafts() { try { return JSON.parse(localStorage.getItem(DRAFT_STORAGE_KEY) || '{}'); } catch(e) { return {}; } }
        function getDraft(id) { const drafts = readDrafts(); return Object.prototype.hasOwnProperty.call(drafts, id) ? drafts[id].text : null; }
        function scheduleDraftSave(id, value) {
            clearTimeout(draftSaveTimers[id]);
            draftSaveTimers[id] = setTimeout(() => {
                try {
                    const drafts = readDrafts();
                    if (value.trim()) drafts[id] = { text: value, updatedAt: new Date().toISOString() };
                    else delete drafts[id];
                    localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(drafts));
                    const note = document.getElementById(`draft-note-${id}`);
                    if (note) note.textContent = value.trim() ? '자동 저장됨' : '입력 내용은 자동으로 임시 저장됩니다.';
                } catch(e) {}
            }, 450);
        }
        function clearDraft(id) { try { const drafts = readDrafts(); delete drafts[id]; localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(drafts)); } catch(e) {} }

        // ── 관리자 회신 저장 ──────────────────────────────────────
        window.clearReplyHistory = function (id) {
            if (!isAdmin) { showToast('Administrator authentication is required.', 'warning'); return; }
            const target = petitions.find(p => String(p.id) === String(id));
            if (!target) return;
            if (!confirm('Clear the reply processing change history for this petition?')) return;
            target.replyHistory = [];
            savePetitions();
            renderCards();
            showToast('Reply processing history cleared.', 'success');
        };

        window.saveAdminReply = function (id) {
            if (!isAdmin) { showToast('Administrator authentication is required.', 'warning'); return; }
            const textarea = document.getElementById(`admin-textarea-${id}`);
            const processStatusSelect = document.getElementById(`process-status-${id}`);
            const replyStatusSelect = document.getElementById(`reply-status-${id}`);
            const prioritySelect = document.getElementById(`priority-${id}`);
            if (!processStatusSelect || !replyStatusSelect || !prioritySelect) return;
            const target = petitions.find(p => p.id === id);
            if (!target) return;
            const newProcessStatus = processStatusSelect.value;
            const newReplyStatus = replyStatusSelect.value || null;
            const newPriority = prioritySelect.value;
            const textVal = textarea ? textarea.value.trim() : (target.replyContent || '');
            if (newReplyStatus === '회신 완료' && !textVal) {
                showToast('회신 완료로 변경하려면 회신 내용을 입력해 주세요.', 'warning'); return;
            }
            const oldReply = target.replyContent || '';
            const oldProcessStatus = target.status || '접수';
            const oldReplyStatus = target.replyStatus || null;
            const oldPriority = target.priority || '일반';
            const changes = [];
            if (oldReply !== textVal) changes.push('회신 내용 변경');
            if (oldProcessStatus !== newProcessStatus) changes.push(`처리 상태: ${oldProcessStatus} → ${newProcessStatus}`);
            if (oldReplyStatus !== newReplyStatus) changes.push(`회신 상태: ${oldReplyStatus} → ${newReplyStatus}`);
            if (oldPriority !== newPriority) changes.push(`우선순위: ${oldPriority} → ${newPriority}`);
            target.replyContent = textVal;
            target.status = newProcessStatus;
            target.replyStatus = newReplyStatus;
            target.priority = newPriority;
            if (changes.length) {
                target.replyHistory = Array.isArray(target.replyHistory) ? target.replyHistory : [];
                target.replyHistory.push({ at: new Date().toLocaleString('ko-KR'), summary: changes.join(' · ') });
            }
            target.isNew = false;
            clearDraft(id);
            savePetitions();
            showToast(`안건 #${id}의 처리 내용이 저장되었습니다.`, 'success');
            renderCards();
        };

        // ── 엑셀 업로드 (파싱 → 미리보기 → 확인 후 반영) ────────────
        btnExcelUpload.addEventListener('click', () => {
            excelFileInput.click();
        });

        function normalizeDuplicateText(value) { return String(value || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
        function isDuplicatePetition(item, pool = petitions) {
            const key = `${normalizeDuplicateText(item.dorm)}|${normalizeDuplicateText(item.category)}|${normalizeDuplicateText(item.content)}`;
            return pool.some(p => `${normalizeDuplicateText(p.dorm)}|${normalizeDuplicateText(p.category)}|${normalizeDuplicateText(p.content)}` === key);
        }
        function findHeaderIndex(rows) {
            const aliases = { date:['날짜','일시','등록일','접수일','작성일'], dorm:['기숙사','생활관','관'], category:['분류','카테고리','구분'], content:['내용','건의사항','건의 내용','제안내용','제안 사항','요청내용'] };
            let best = { row:-1, map:{} };
            rows.slice(0,6).forEach((row, ri) => {
                const map = {};
                (row || []).forEach((cell, ci) => {
                    const h = normalizeDuplicateText(cell).replace(/\s/g,'');
                    for (const [key, list] of Object.entries(aliases)) if (list.some(a => h === normalizeDuplicateText(a).replace(/\s/g,''))) map[key] = ci;
                });
                const score = Object.keys(map).length;
                if (score > Object.keys(best.map).length) best = { row:ri, map };
            });
            return best;
        }
        function excelDateValue(value) {
            if (value instanceof Date) return value.toISOString().slice(0,19).replace('T',' ');
            if (typeof value === 'number' && XLSX.SSF && XLSX.SSF.parse_date_code) { const d = XLSX.SSF.parse_date_code(value); if (d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')} ${String(d.H||0).padStart(2,'0')}:${String(d.M||0).padStart(2,'0')}:${String(d.S||0).padStart(2,'0')}`; }
            return String(value || '').trim();
        }
        function inferDorm(raw) { const text = String(raw || ''); return (text.includes('청운관') || text.includes('여성')) ? '청운관, 여성 기숙사' : '미래관, 남성 기숙사'; }
        function inferCategory(raw) {
            const text = String(raw || '');
            if (text.includes('규정') || text.includes('점호') || text.includes('벌점')) return '생활 규정 및 점호';
            if (text.includes('시설') || text.includes('설비') || text.includes('파손')) return '시설 및 설비';
            if (text.includes('청소') || text.includes('위생') || text.includes('방역')) return '청소 및 위생';
            if (text.includes('소음') || text.includes('보안')) return '소음 및 보안';
            return '기타';
        }

        btnExcelUpload.addEventListener('click', () => excelFileInput.click());
        excelFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const workbook = XLSX.read(new Uint8Array(evt.target.result), { type:'array', cellDates:true });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header:1, defval:'' });
                    if (json.length < 1) { showToast('엑셀 파일 내 유효한 데이터가 없습니다.', 'warning'); excelFileInput.value=''; return; }
                    const header = findHeaderIndex(json);
                    const start = header.row >= 0 ? header.row + 1 : 1;
                    const map = header.row >= 0 ? header.map : {date:0,dorm:3,category:4,content:5};
                    pendingExcelItems = [];
                    for (let i=start;i<json.length;i++) {
                        const row=json[i] || [];
                        const rawDate = row[map.date] || '';
                        const rawDorm = row[map.dorm] || '';
                        const rawCat = row[map.category] || '';
                        const rawContent = row[map.content] || '';
                        const content = String(rawContent).trim();
                        if (!content) continue;
                        const item={ dorm:inferDorm(rawDorm), category:inferCategory(rawCat || content), date:excelDateValue(rawDate) || new Date().toISOString().slice(0,19).replace('T',' '), content };
                        item.isDuplicate = isDuplicatePetition(item) || isDuplicatePetition(item, pendingExcelItems.filter(x => !x.isDuplicate));
                        pendingExcelItems.push(item);
                    }
                    if (!pendingExcelItems.length) { showToast('엑셀 파일 내 유효한 데이터가 없습니다.', 'warning'); excelFileInput.value=''; return; }
                    openExcelPreview();
                } catch(err) { console.error(err); showToast('엑셀 파일을 읽는 도중 오류가 발생했습니다. 파일 형식을 확인해 주세요.', 'error'); excelFileInput.value=''; }
            };
            reader.readAsArrayBuffer(file);
        });

        const excelPreviewOverlay = document.getElementById('excel-preview-overlay');
        function openExcelPreview() {
            const summary=document.getElementById('excel-preview-summary');
            const list=document.getElementById('excel-preview-list');
            const duplicates=pendingExcelItems.filter(i=>i.isDuplicate).length;
            const additions=pendingExcelItems.length-duplicates;
            summary.textContent=`새 안건 ${additions}건을 찾았습니다. 중복 ${duplicates}건은 적용에서 자동 제외됩니다.`;
            list.innerHTML=pendingExcelItems.map(item=>{
                const cls=item.dorm.includes('미래관')?'badge-mirae':'badge-cheongun';
                const preview=item.content.length>90?item.content.slice(0,90)+'…':item.content;
                return `<div class="excel-preview-item" style="${item.isDuplicate?'opacity:.62':''}"><div class="excel-preview-meta"><span class="badge-dorm ${cls}">${escapeHtml(item.dorm)}</span><span class="category-badge">${escapeHtml(item.category)}</span><span class="card-date">${escapeHtml(item.date)}</span><span class="${item.isDuplicate?'excel-duplicate':'excel-new'}">${item.isDuplicate?'중복':'추가'}</span></div><div class="excel-preview-content">${escapeHtml(preview)}</div></div>`;
            }).join('');
            excelPreviewOverlay.style.display='flex';
        }
        function closeExcelPreview(){ excelPreviewOverlay.style.display='none'; pendingExcelItems=[]; excelFileInput.value=''; }
        document.getElementById('btn-excel-preview-close').addEventListener('click',closeExcelPreview);
        document.getElementById('btn-excel-cancel').addEventListener('click',closeExcelPreview);
        excelPreviewOverlay.addEventListener('click',e=>{if(e.target===excelPreviewOverlay)closeExcelPreview();});
        document.getElementById('btn-excel-confirm').addEventListener('click',()=>{
            const toAdd=pendingExcelItems.filter(i=>!i.isDuplicate);
            if(!toAdd.length){ closeExcelPreview(); showToast('추가할 새 안건이 없습니다. 중복 항목은 제외되었습니다.','info'); return; }
            let nextId=petitions.length?Math.max(...petitions.map(p=>p.id))+1:1;
            toAdd.forEach(item=>petitions.push({id:nextId++,dorm:item.dorm,category:item.category,date:item.date,content:item.content,status:'접수',priority:'일반',replyStatus:null,replyContent:'',replyHistory:[],isNew:true}));
            savePetitions(); showToast(`엑셀 파일로부터 ${toAdd.length}건의 건의사항이 추가되었습니다.`,'success'); closeExcelPreview(); renderCards();
        });

        // ── 다크모드 전환 ─────────────────────────────────────────
        function syncThemeButton() {
            const theme = document.documentElement.getAttribute('data-theme') || 'light';
            // 현재 다크모드면 "Light Mode"(전환 시 갈 곳)를, 현재 라이트모드면 "Dark Mode"를 라벨로 표시
            btnThemeToggle.textContent = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
            btnThemeToggle.setAttribute('aria-label', theme === 'dark' ? '라이트 모드로 전환' : '다크 모드로 전환');
        }
        syncThemeButton();

        btnThemeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            document.documentElement.style.colorScheme = next;
            try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* 저장 불가 시 세션 내에서만 유지 */ }
            syncThemeButton();
        });

        // ── 맨 위로 버튼 ──────────────────────────────────────────
        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) {
                btnBackToTop.classList.add('show');
            } else {
                btnBackToTop.classList.remove('show');
            }
        });
        btnBackToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ── 인쇄용 보기 모드 ──────────────────────────────────────
        function setPrintPreview(active) {
            document.body.classList.toggle('print-preview-mode', active);
            printModeBar.style.display = active ? 'flex' : 'none';
            btnPrintView.textContent = active ? 'Exit Print View' : 'Print View';
            if (active) { printRange = printRangeSelect.value; renderCards(); }
            else renderCards();
        }
        btnPrintView.addEventListener('click',()=>setPrintPreview(!document.body.classList.contains('print-preview-mode')));
        document.getElementById('btn-exit-print').addEventListener('click',()=>setPrintPreview(false));
        document.getElementById('btn-do-print').addEventListener('click',()=>window.print());
        printRangeSelect.addEventListener('change',()=>{printRange=printRangeSelect.value; if(document.body.classList.contains('print-preview-mode')) renderCards();});

        btnResetFilters.addEventListener('click',()=>{ searchInput.value=''; filterDorm.value='all'; filterCategory.value='all'; filterStatus.value='all'; filterPriority.value='all'; filterSort.value='id_asc'; renderCards(); showToast('검색 및 필터 조건을 초기화했습니다.','info',2200); });
        searchInput.addEventListener('input',renderCards);
        filterDorm.addEventListener('change',renderCards);
        filterCategory.addEventListener('change',renderCards);
        filterStatus.addEventListener('change',renderCards);
        filterPriority.addEventListener('change',renderCards);
        filterSort.addEventListener('change',renderCards);

        document.addEventListener('keydown',e=>{ if(e.key==='Escape' && adminLoginOverlay.style.display==='flex') closeAdminLoginModal(); });
        // 첫 화면은 클라우드 인증/동기화를 기다리지 않고 즉시 기본 안건을 표시한다.
        // Supabase가 느리거나 일시적으로 응답하지 않아도 초기 목록이 0건으로 보이지 않도록 한다.
        updateAdminLoginMode();
        renderCards();

        restoreAdminSession()
            .then(() => {
                renderCards();
                if (supabase) return initializeCloud();
            })
            .catch((e) => {
                console.error('초기 관리자 세션 확인 오류:', e);
                renderCards();
            });
    </script>
</body>
</html>
